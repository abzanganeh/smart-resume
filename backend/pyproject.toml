[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "smart-resume-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aioredis>=2.0.1",
    "anthropic>=0.105.0",
    "fastapi>=0.136.3",
    "google-generativeai>=0.8.6",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "openai>=2.38.0",
    "pdfplumber>=0.11.9",
    "pydantic-settings>=2.14.1",
    "pydantic[email]>=2.13.4",
    "pyppeteer>=2.0.0",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.29",
    "redis>=8.0.0",
    "sentry-sdk>=2.61.0",
    "slowapi>=0.1.9",
    "structlog>=25.5.0",
    "uvicorn[standard]>=0.48.0",
]

[dependency-groups]
dev = [
    "hatchling>=1.29.0",
]
