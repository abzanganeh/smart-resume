[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "smart-resume-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aioredis>=2.0.1",
    "alembic>=1.14.0",
    "anthropic>=0.105.0",
    "asyncpg>=0.30.0",
    "cryptography>=43.0.0",
    "fastapi>=0.136.3",
    "google-generativeai>=0.8.6",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "openai>=2.38.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt<4.1.0,>=4.0.1",
    "pdfplumber>=0.11.9",
    "pydantic-settings>=2.14.1",
    "pydantic[email]>=2.13.4",
    "pyotp>=2.9.0",
    "python-docx>=1.2.0",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.29",
    "redis>=8.0.0",
    "resend>=2.4.0",
    "sentry-sdk>=2.61.0",
    "slowapi>=0.1.9",
    "sqlalchemy[asyncio]>=2.0.40",
    "stripe>=11.4.0",
    "structlog>=25.5.0",
    "tiktoken>=0.9.0",
    "uvicorn[standard]>=0.48.0",
    "weasyprint>=68.1",
    "zxcvbn>=4.5.0",
    "pgvector>=0.4.2",
]

[dependency-groups]
dev = [
    "hatchling>=1.29.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: tests that require a live external service (postgres, redis, etc.)",
]
