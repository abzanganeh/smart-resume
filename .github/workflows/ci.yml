name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Full suite nightly — catches drift when main only ran the fast gate.
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Supply-chain jobs pin Actions to full SHAs (OWASP A03). Refresh when bumping tags.
# actions/checkout@v4.2.2 → 11bd71901bbe5b1630ceea73d27597364c9af683
# astral-sh/setup-uv@v5.4.1 → 0c5e2b8115b80b4c7c5ddf6ffdd634974642d182
# pnpm/action-setup@v4.1.0 → 7088e561eb65bb68695d245aa206f005ef30921d
# actions/setup-node@v4.4.0 → 49933ea5288caeca8642d1e84afbd3f7d6820020
# gitleaks/gitleaks-action@v2 → ff98106e4c7b2bc287b24eaf42907196329070c7
# security-supply-chain is blocking; pip-audit uses backend/ci/run-pip-audit.sh + allowlist.

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      ci_config: ${{ steps.filter.outputs.ci_config }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            ci_config:
              - '.github/**'

  backend-unit:
    name: Backend unit tests
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.ci_config == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run unit tests
        run: uv run pytest tests/unit -m "not integration" -v --tb=short
        env:
          APP_ENV: ci
          AUTH_DISABLE: "false"
          AUTH_SECRET: ci-test-auth-secret-not-for-production
          BYOK_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
          DATABASE_URL: postgresql+asyncpg://smart_resume:password@localhost:5432/smart_resume_test
          REDIS_URL: redis://localhost:6379

  backend-integration:
    name: Backend integration tests
    needs: changes
    if: |
      (github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      (needs.changes.outputs.backend == 'true' || needs.changes.outputs.ci_config == 'true')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: smart_resume_test
          POSTGRES_USER: smart_resume
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smart_resume -d smart_resume_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run migrations
        run: uv run alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://smart_resume:password@localhost:5432/smart_resume_test

      - name: Run integration tests
        run: uv run pytest tests/integration tests/admin tests/unit -m integration -v --tb=short
        env:
          APP_ENV: ci
          AUTH_DISABLE: "false"
          AUTH_SECRET: ci-test-auth-secret-not-for-production
          BYOK_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
          DATABASE_URL: postgresql+asyncpg://smart_resume:password@localhost:5432/smart_resume_test
          REDIS_URL: redis://localhost:6379
          GEMINI_API_KEY: ci-test-gemini-key
          OPENAI_API_KEY: ci-test-openai-key

  migration-safety:
    name: Migration safety
    needs: changes
    if: |
      (github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      (needs.changes.outputs.backend == 'true' || needs.changes.outputs.ci_config == 'true')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: smart_resume_migrate
          POSTGRES_USER: smart_resume
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smart_resume -d smart_resume_migrate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Assert single Alembic head
        run: |
          heads=$(uv run alembic heads | wc -l)
          if [ "$heads" -ne 1 ]; then
            echo "Expected exactly one Alembic head, found $heads"
            uv run alembic heads
            exit 1
          fi

      - name: Upgrade empty database
        run: uv run alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://smart_resume:password@localhost:5432/smart_resume_migrate

  frontend:
    name: Frontend lint and build
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci_config == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: CI gate (lint + unit + build)
        run: pnpm run test:ci
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NEXTAUTH_SECRET: ci-test-secret-not-for-production
          NEXTAUTH_URL: http://localhost:3000

  frontend-e2e-smoke:
    name: Frontend E2E smoke
    needs: changes
    if: |
      (github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      (needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci_config == 'true')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production bundle
        run: pnpm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NEXTAUTH_SECRET: ci-test-secret-not-for-production
          NEXTAUTH_URL: http://localhost:3000

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E smoke tests
        run: pnpm run test:e2e:smoke
        env:
          CI: true
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NEXTAUTH_SECRET: ci-test-secret-not-for-production
          NEXTAUTH_URL: http://localhost:3000

      - name: Run E2E unsynced-pricing fallback
        run: pnpm run test:e2e:pricing-unsynced
        env:
          CI: true
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NEXTAUTH_SECRET: ci-test-secret-not-for-production
          NEXTAUTH_URL: http://localhost:3000

  security-supply-chain:
    name: Security supply chain (A03)
    needs: changes
    if: |
      (github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci_config == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182
        with:
          enable-cache: true

      - name: Set up Python
        working-directory: backend
        run: uv python install 3.12

      - name: Enforce frozen backend lockfile
        working-directory: backend
        run: uv sync --frozen

      - name: pip-audit (backend, uv.lock)
        working-directory: backend
        run: bash ci/run-pip-audit.sh

      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d
        with:
          version: 9

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Enforce frozen frontend lockfile
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: npm audit (frontend, pnpm)
        working-directory: frontend
        run: |
          for attempt in 1 2 3; do
            if pnpm audit --audit-level=high; then
              exit 0
            fi
            echo "pnpm audit attempt ${attempt} failed; retrying in 30s..."
            sleep 30
          done
          exit 1

      - name: gitleaks detect (PR)
        if: github.event_name == 'pull_request'
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend-security:
    name: Backend security tests
    needs: changes
    if: |
      (github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      (needs.changes.outputs.backend == 'true' || needs.changes.outputs.ci_config == 'true')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: smart_resume_test
          POSTGRES_USER: smart_resume
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smart_resume -d smart_resume_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install uv
        uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run migrations
        run: uv run alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://smart_resume:password@localhost:5432/smart_resume_test

      - name: Run security tests
        run: uv run pytest tests/security -v --tb=short
        env:
          APP_ENV: ci
          AUTH_DISABLE: "false"
          AUTH_SECRET: ci-test-auth-secret-not-for-production
          BYOK_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
          DATABASE_URL: postgresql+asyncpg://smart_resume:password@localhost:5432/smart_resume_test
          REDIS_URL: redis://localhost:6379
          GEMINI_API_KEY: ci-test-gemini-key
          OPENAI_API_KEY: ci-test-openai-key
