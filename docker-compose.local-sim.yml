# Local simulation overlay — use ONLY for workstation smoke tests.
#   docker compose -f docker-compose.yml -f docker-compose.staging.yml -f docker-compose.local-sim.yml up -d --build
#
# Do NOT include this file on public staging/production VMs (STAGING.md §8).

services:
  backend:
    volumes:
      # Local smoke: pick up backend search/auth fixes without a full image rebuild.
      - ./backend/app:/app/app
      # Pydantic loads /app/.env at import time; override baked dev secrets for Mailpit smoke.
      - ./backend/.env.staging:/app/.env:ro
    environment:
      # Workstation smoke: avoid slowapi 429s while clicking through onboarding.
      APP_ENV: local
      # Empty YAML value does not set os.environ; explicit "" forces SMTP over baked Resend key.
      RESEND_API_KEY: ""
      # Repeated smoke runs share one host IP and one curl User-Agent fingerprint.
      SIGNUP_IP_DAILY_LIMIT: 200
      SIGNUP_IP_DEVICE_DAILY_LIMIT: 200

  mailpit:
    ports: !override
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-31025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-38025}:8025"
